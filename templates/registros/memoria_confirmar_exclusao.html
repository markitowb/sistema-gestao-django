{% extends 'base.html' %}
{% block title %}Excluir Memória{% endblock %}
{% block content %}
<div class="card mx-auto" style="max-width:500px;">
    <div class="card-body text-center p-5">
        <i class="bi bi-exclamation-triangle text-danger" style="font-size:3rem;"></i>
        <h5 class="mt-3">Confirmar exclusão</h5>
        <p class="text-muted">
            Tem certeza que deseja excluir <strong>{{ memoria.titulo }}</strong>?
            Essa ação não pode ser desfeita.
        </p>
        <form method="post" class="d-flex gap-2 justify-content-center mt-4">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">
                <i class="bi bi-trash"></i> Sim, excluir
            </button>
            <a href="{% url 'registros:memoria_lista' %}" class="btn btn-outline-secondary">
                Cancelar
            </a>
        </form>
    </div>
</div>
{% endblock %}
