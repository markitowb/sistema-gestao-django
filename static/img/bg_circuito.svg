<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" opacity="0.15">
  <!-- Linhas de circuito -->
  <line x1="20" y1="20" x2="80" y2="20" stroke="#1565c0" stroke-width="1"/>
  <line x1="80" y1="20" x2="80" y2="60" stroke="#1565c0" stroke-width="1"/>
  <line x1="80" y1="60" x2="140" y2="60" stroke="#1565c0" stroke-width="1"/>
  <line x1="140" y1="60" x2="140" y2="20" stroke="#1565c0" stroke-width="1"/>
  <line x1="140" y1="20" x2="180" y2="20" stroke="#1565c0" stroke-width="1"/>
  <line x1="20" y1="100" x2="60" y2="100" stroke="#1565c0" stroke-width="1"/>
  <line x1="60" y1="100" x2="60" y2="140" stroke="#1565c0" stroke-width="1"/>
  <line x1="60" y1="140" x2="120" y2="140" stroke="#1565c0" stroke-width="1"/>
  <line x1="120" y1="140" x2="120" y2="100" stroke="#1565c0" stroke-width="1"/>
  <line x1="120" y1="100" x2="180" y2="100" stroke="#1565c0" stroke-width="1"/>
  <line x1="160" y1="20" x2="160" y2="80" stroke="#1565c0" stroke-width="1"/>
  <line x1="160" y1="80" x2="180" y2="80" stroke="#1565c0" stroke-width="1"/>
  <line x1="20" y1="160" x2="40" y2="160" stroke="#1565c0" stroke-width="1"/>
  <line x1="40" y1="160" x2="40" y2="180" stroke="#1565c0" stroke-width="1"/>
  <line x1="100" y1="160" x2="180" y2="160" stroke="#1565c0" stroke-width="1"/>

  <!-- Nós do circuito -->
  <circle cx="80"  cy="20"  r="3" fill="#1e88e5"/>
  <circle cx="80"  cy="60"  r="3" fill="#1e88e5"/>
  <circle cx="140" cy="60"  r="3" fill="#1e88e5"/>
  <circle cx="140" cy="20"  r="3" fill="#1e88e5"/>
  <circle cx="60"  cy="100" r="3" fill="#1e88e5"/>
  <circle cx="60"  cy="140" r="3" fill="#1e88e5"/>
  <circle cx="120" cy="140" r="3" fill="#1e88e5"/>
  <circle cx="120" cy="100" r="3" fill="#1e88e5"/>
  <circle cx="160" cy="80"  r="3" fill="#1e88e5"/>
  <circle cx="40"  cy="160" r="3" fill="#1e88e5"/>

  <!-- Cadeado pequeno -->
  <rect x="88" y="175" width="14" height="12" rx="2"
        fill="none" stroke="#1565c0" stroke-width="1"/>
  <path d="M91 175 v-4 a4 4 0 0 1 8 0 v4"
        fill="none" stroke="#1565c0" stroke-width="1"/>
  <circle cx="95" cy="181" r="2" fill="#1565c0"/>

  <!-- Escudo pequeno -->
  <path d="M170 130 l8 -4 l8 4 v8 a8 8 0 0 1-8 6 a8 8 0 0 1-8-6 z"
        fill="none" stroke="#1565c0" stroke-width="1"/>
</svg>
